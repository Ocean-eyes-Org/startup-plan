<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8fb">
<title>OceanEyes startup canvas</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202632; background: #f6f8fb; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { z-index: 2; height: 58px; flex: 0 0 58px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: rgba(255,255,255,.96); border-bottom: 1px solid #dce2e9; box-shadow: 0 1px 5px #17212b0d; }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  .badge { color: #526174; font-size: 12px; border: 1px solid #d8dee7; border-radius: 999px; padding: 4px 9px; background: #f7f9fb; }
  .spacer { flex: 1; }
  .hint { font-size: 12px; color: #697586; margin-right: 8px; }
  button { width: 34px; height: 32px; padding: 0; border: 1px solid #d8dee7; border-radius: 7px; background: #fff; color: #283445; font-size: 17px; cursor: pointer; }
  button:hover { background: #f0f4f8; }
  button.fit { width: auto; padding: 0 10px; font-size: 12px; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: grab; background-color: #f6f8fb; background-image: radial-gradient(#d8dfe8 1px, transparent 1px); background-size: 22px 22px; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: #aeb7c4; stroke-width: 2.25; }
  .card { position: absolute; overflow: auto; padding: 15px 17px; border: 1px solid #d6dce4; border-radius: 10px; background: #fff; color: #222a35; box-shadow: 0 3px 12px #17212b14; cursor: default; user-select: text; }
  .card.colored { border-color: var(--accent); background: var(--tint); }
  .card-content { font-size: 15px; line-height: 1.42; overflow-wrap: anywhere; }
  .card-content h1, .card-content h2, .card-content h3, .card-content h4 { margin: 0 0 8px; line-height: 1.2; color: #18212e; }
  .card-content h1 { font-size: 21px; }
  .card-content h2 { font-size: 17px; }
  .card-content h3, .card-content h4 { font-size: 15px; }
  .card-content p { margin: 0 0 5px; }
  .card-content .bullet { position: relative; margin: 0 0 3px; padding-left: 16px; }
  .card-content .bullet::before { content: "•"; position: absolute; left: 1px; color: #687588; }
  .card-content hr { border: 0; border-top: 1px solid #cfd6df; margin: 7px 0; }
  .card-content strong { font-weight: 700; }
  .card-content em { font-style: italic; }
  .error { margin: auto; max-width: 720px; padding: 24px; color: #8b2635; background: white; border: 1px solid #efc7cd; border-radius: 10px; font: 14px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  @media (max-width: 620px) { header { padding: 0 9px; gap: 6px; } header h1 { font-size: 13px; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <h1>OceanEyes startup</h1>
  <span class="badge">Read only</span>
  <span class="spacer"></span>
  <span class="hint">Drag empty space to pan · scroll to zoom</span>
  <button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
  <button id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
  <button id="fit" class="fit" title="Fit canvas to screen">Fit</button>
</header>
<main id="stage" aria-label="Read-only OceanEyes canvas">
  <div id="world"><svg id="edges" aria-hidden="true"></svg></div>
</main>
<script>
(() => {
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const svg = document.getElementById("edges");
  const colors = {
    "1": ["#f8dddd", "#d77979"], "2": ["#fbe6d2", "#d99b57"],
    "3": ["#fff2cc", "#d7b84d"], "4": ["#e1f0dc", "#82ae72"],
    "5": ["#dcecf3", "#73a7c2"], "6": ["#eee2f4", "#a37bb5"]
  };
  let scale = 1, tx = 0, ty = 0, worldWidth = 1, worldHeight = 1;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
  const applyTransform = () => { world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; };
  const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
  function inlineMarkdown(value) {
    return escapeHtml(value)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  function renderMarkdown(value) {
    return String(value || "").split(/\r?\n/).map(line => {
      if (!line.trim()) return "";
      if (/^\s*---+\s*$/.test(line)) return "<hr>";
      const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
      if (heading) return `<h${Math.min(4, heading[1].length)}>${inlineMarkdown(heading[2])}</h${Math.min(4, heading[1].length)}>`;
      const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
      if (bullet) return `<div class="bullet" style="margin-left:${Math.min(240, bullet[1].replace(/\t/g, "    ").length * 8)}px">${inlineMarkdown(bullet[2])}</div>`;
      return `<p>${inlineMarkdown(line)}</p>`;
    }).join("");
  }
  function fit() {
    const rect = stage.getBoundingClientRect();
    scale = clamp(Math.min((rect.width - 32) / worldWidth, (rect.height - 32) / worldHeight), 0.035, 1.5);
    tx = (rect.width - worldWidth * scale) / 2;
    ty = (rect.height - worldHeight * scale) / 2;
    applyTransform();
  }
  function zoomAt(nextScale, clientX, clientY) {
    const rect = stage.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const wx = (px - tx) / scale, wy = (py - ty) / scale;
    scale = clamp(nextScale, 0.035, 6);
    tx = px - wx * scale; ty = py - wy * scale;
    applyTransform();
  }
  function sidePoint(node, side, offsetX, offsetY) {
    const x = offsetX + node.x, y = offsetY + node.y;
    if (side === "left") return {x, y: y + node.height / 2, dx: -1, dy: 0};
    if (side === "right") return {x: x + node.width, y: y + node.height / 2, dx: 1, dy: 0};
    if (side === "top") return {x: x + node.width / 2, y, dx: 0, dy: -1};
    return {x: x + node.width / 2, y: y + node.height, dx: 0, dy: 1};
  }
  function showError(message) {
    stage.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
  }
  async function load() {
    try {
      const response = await fetch("./OceanEyes%20startup.canvas", {cache: "no-store"});
      if (!response.ok) throw new Error(`Could not load the canvas file (${response.status}).`);
      const data = await response.json();
      const nodes = data.nodes || [], edges = data.edges || [];
      if (!nodes.length) throw new Error("This canvas has no nodes to display.");
      if (nodes.some(node => node.type !== "text")) throw new Error("This viewer expects text-only canvas nodes.");
      const minX = Math.min(...nodes.map(node => node.x));
      const minY = Math.min(...nodes.map(node => node.y));
      const maxX = Math.max(...nodes.map(node => node.x + node.width));
      const maxY = Math.max(...nodes.map(node => node.y + node.height));
      const pad = 70, offsetX = pad - minX, offsetY = pad - minY;
      worldWidth = maxX - minX + pad * 2; worldHeight = maxY - minY + pad * 2;
      world.style.width = `${worldWidth}px`; world.style.height = `${worldHeight}px`;
      svg.setAttribute("width", worldWidth); svg.setAttribute("height", worldHeight);
      svg.setAttribute("viewBox", `0 0 ${worldWidth} ${worldHeight}`);
      const nodeById = new Map(nodes.map(node => [node.id, node]));
      for (const edge of edges) {
        const from = nodeById.get(edge.fromNode), to = nodeById.get(edge.toNode);
        if (!from || !to) continue;
        const a = sidePoint(from, edge.fromSide, offsetX, offsetY);
        const b = sidePoint(to, edge.toSide, offsetX, offsetY);
        const length = Math.max(48, Math.hypot(b.x - a.x, b.y - a.y) * 0.36);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "edge");
        path.setAttribute("d", `M ${a.x} ${a.y} C ${a.x + a.dx * length} ${a.y + a.dy * length}, ${b.x - b.dx * length} ${b.y - b.dy * length}, ${b.x} ${b.y}`);
        svg.appendChild(path);
      }
      for (const node of nodes) {
        const card = document.createElement("article");
        card.className = "card";
        card.style.left = `${offsetX + node.x}px`; card.style.top = `${offsetY + node.y}px`;
        card.style.width = `${node.width}px`; card.style.height = `${node.height}px`;
        if (node.color) {
          const palette = colors[String(node.color)];
          const tint = palette ? palette[0] : (/^#[0-9a-f]{6}$/i.test(String(node.color)) ? `${node.color}22` : null);
          const accent = palette ? palette[1] : (/^#[0-9a-f]{6}$/i.test(String(node.color)) ? String(node.color) : null);
          if (tint && accent) { card.classList.add("colored"); card.style.setProperty("--tint", tint); card.style.setProperty("--accent", accent); }
        }
        const content = document.createElement("div"); content.className = "card-content";
        content.innerHTML = renderMarkdown(node.text);
        card.appendChild(content); world.appendChild(card);
      }
      requestAnimationFrame(fit);
    } catch (error) { showError(error.message || "Unable to load this canvas."); }
  }
  stage.addEventListener("wheel", event => {
    event.preventDefault();
    zoomAt(scale * Math.exp(-event.deltaY * 0.0012), event.clientX, event.clientY);
  }, {passive: false});
  let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
  stage.addEventListener("pointerdown", event => {
    if (event.button !== 0 || event.target.closest(".card")) return;
    dragging = true; startX = event.clientX; startY = event.clientY; startTx = tx; startTy = ty;
    stage.classList.add("dragging"); stage.setPointerCapture(event.pointerId); event.preventDefault();
  });
  stage.addEventListener("pointermove", event => {
    if (!dragging) return;
    tx = startTx + event.clientX - startX; ty = startTy + event.clientY - startY; applyTransform();
  });
  function stopDrag() { dragging = false; stage.classList.remove("dragging"); }
  stage.addEventListener("pointerup", stopDrag); stage.addEventListener("pointercancel", stopDrag);
  document.getElementById("zoom-in").addEventListener("click", () => zoomAt(scale * 1.25, innerWidth / 2, innerHeight / 2));
  document.getElementById("zoom-out").addEventListener("click", () => zoomAt(scale / 1.25, innerWidth / 2, innerHeight / 2));
  document.getElementById("fit").addEventListener("click", fit);
  window.addEventListener("resize", fit);
  load();
})();
</script>
</body>
</html>
