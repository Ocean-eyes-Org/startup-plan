<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Role — Let’s Talk</title>
  <style>
    :root{
      --ink:#172033;
      --muted:#667085;
      --soft:#98a2b3;
      --page:#ffffff;
      --subtle:#f7f8fa;
      --line:#e6e8ec;
      --line-strong:#d5d9e0;
      --success:#16845b;
      --radius:10px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--page)}
    body{
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
        "Noto Sans Thai","Leelawadee UI",Tahoma,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .screen-nav{
      width:min(1120px,calc(100% - 40px));
      margin:0 auto;
      padding-top:18px;
      display:flex;
      justify-content:flex-end;
    }
    .screen-switcher{
      display:inline-flex;
      gap:4px;
      padding:4px;
      border:1px solid var(--line);
      border-radius:10px;
      background:var(--subtle);
    }
    .screen-tab{
      min-height:34px;
      padding:0 12px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:720;
    }
    .screen-tab.active{
      background:#fff;
      color:var(--ink);
      box-shadow:0 0 0 1px var(--line);
    }

    .page{
      width:min(1120px,calc(100% - 40px));
      margin:0 auto;
      padding:22px 0 56px;
    }

    .hero{margin-bottom:34px}
    .title{
      margin:0;
      font-size:clamp(38px,5.4vw,58px);
      line-height:1.06;
      letter-spacing:-.045em;
      font-weight:760;
      color:var(--ink);
    }
    .subtitle{
      margin-top:5px;
      font-size:16px;
      color:var(--muted);
      line-height:1.5;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      margin-bottom:14px;
    }
    .section-title{font-size:13px;font-weight:760;color:#344054}
    .save-state{
      display:flex;
      margin-left:auto;
      align-items:center;
      gap:6px;
      color:var(--success);
      font-size:11px;
      white-space:nowrap;
    }
    .save-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}

    .role-layout{
      display:grid;
      grid-template-columns:minmax(320px,480px) minmax(310px,1fr);
      gap:44px;
      align-items:center;
    }
    .role-chart-card{display:flex;justify-content:center}
    .role-chart{width:min(100%,420px);aspect-ratio:1}
    .role-chart svg{display:block;width:100%;height:100%}

    .role-options{display:flex;flex-direction:column;gap:10px}
    .role-option{
      display:grid;
      grid-template-columns:20px 12px minmax(0,1fr) auto auto;
      align-items:center;
      gap:12px;
      min-height:48px;
      padding:7px 10px 7px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
    }
    .role-drag-handle{
      width:20px;
      height:32px;
      display:grid;
      place-items:center;
      color:#b0b7c3;
      font-size:15px;
      line-height:1;
      cursor:grab;
      user-select:none;
      touch-action:none;
      border-radius:6px;
    }
    .role-drag-handle:hover{background:var(--subtle);color:#667085}
    .role-drag-handle:active{cursor:grabbing}
    .role-drag-handle:focus-visible{outline:3px solid #f2f4f7;outline-offset:1px}
    .role-option.dragging{opacity:.5}
    .role-option.drop-before{box-shadow:inset 0 2px 0 #667085}
    .role-option.drop-after{box-shadow:inset 0 -2px 0 #667085}
    .role-swatch{width:10px;height:10px;border-radius:50%;background:var(--role-color)}
    .role-name{font-size:14px;font-weight:650;color:#243042}
    .role-name-input{
      width:100%;
      min-width:0;
      padding:4px 6px;
      margin-left:-6px;
      border:1px solid transparent;
      border-radius:7px;
      background:transparent;
      color:#243042;
      font-size:14px;
      font-weight:650;
      outline:none;
    }
    .role-name-input:hover{background:var(--subtle);border-color:var(--line)}
    .role-name-input:focus{background:#fff;border-color:#98a2b3;box-shadow:0 0 0 3px #f2f4f7}
    .role-list-actions{margin-top:9px;display:flex;align-items:center}
    .add-role-button{
      min-height:34px;
      padding:0 11px;
      border:1px dashed var(--line-strong);
      border-radius:8px;
      background:#fff;
      color:#475467;
      font-size:12px;
      font-weight:720;
    }
    .add-role-button:hover{background:var(--subtle);border-style:solid}
    .add-role-button:focus-visible{outline:3px solid #f2f4f7;outline-offset:1px}
    .delete-role-button{
      width:32px;
      height:32px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid transparent;
      border-radius:7px;
      background:transparent;
      color:#98a2b3;
      font-size:16px;
      line-height:1;
    }
    .delete-role-button:hover{
      background:#fff1f2;
      border-color:#fecdd3;
      color:#e11d48;
    }
    .delete-role-button:focus-visible{
      outline:3px solid #f2f4f7;
      outline-offset:1px;
    }
    .weight-editor{
      display:flex;align-items:center;gap:8px;
      min-width:118px;justify-content:flex-end;
      color:var(--muted);font-size:12px;font-weight:720;
    }
    .role-weight-input{
      width:52px;height:32px;padding:0 7px;
      border:1px solid transparent;border-radius:7px;
      background:transparent;color:#475467;text-align:right;
      font-size:12px;font-weight:760;outline:none;
      -moz-appearance:textfield;
    }
    .role-weight-input::-webkit-outer-spin-button,
    .role-weight-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .role-weight-input:hover{background:var(--subtle);border-color:var(--line)}
    .role-weight-input:focus{background:#fff;border-color:#98a2b3;box-shadow:0 0 0 3px #f2f4f7}
    .role-weight-unit{
      margin-left:-5px;
      color:#98a2b3;
      font-size:11px;
      font-weight:650;
      white-space:nowrap;
    }
    .role-derived-percent{min-width:42px;text-align:right;color:#475467}
    .role-weight-total{
      margin-top:10px;display:flex;justify-content:flex-end;align-items:center;gap:7px;
      color:#344054;font-size:12px;font-weight:760;
    }
    .role-weight-total.invalid{color:#b54708}
    .total-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
    .role-weight-total.invalid .total-dot{background:#f79009}

    .people-section{margin-top:42px}
    .people-list{border-top:1px solid var(--line)}
    .person-row{
      display:grid;
      grid-template-columns:150px minmax(0,1fr) auto;
      gap:18px;
      align-items:start;
      padding:16px 0;
      border-bottom:1px solid var(--line);
    }
    .person-info{display:flex;align-items:center;gap:9px;min-width:0;padding-top:4px}
    .avatar{
      width:24px;height:24px;flex:0 0 auto;
      display:grid;place-items:center;border-radius:50%;
      background:var(--person-soft,#eef2f6);
      color:#344054;font-size:9px;font-weight:800;
    }
    .person-name{font-size:13px;font-weight:720;white-space:nowrap}

    .person-roles{display:flex;flex-wrap:wrap;gap:8px}
    .role-chip{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:7px;
      min-height:32px;
      padding:0 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:#475467;
      font-size:12px;
      font-weight:650;
      cursor:pointer;
      user-select:none;
      transition:border-color .14s ease, background .14s ease, color .14s ease;
    }
    .role-chip:not(.selected){opacity:.42}
    .role-chip:not(.selected):hover{opacity:.62;background:var(--subtle)}
    .role-chip.selected{opacity:1;background:#f8fafc;border-color:#c8d0dc;color:#243042}
    .role-chip input{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;height:1px;
    }
    .chip-dot{width:8px;height:8px;border-radius:50%;background:var(--role-color);opacity:.35}
    .role-chip.selected .chip-dot{opacity:1}
    .chip-share{color:var(--soft);font-weight:720}
    .role-chip.selected .chip-share{color:#667085}

    .person-total{
      min-width:76px;
      text-align:right;
      color:#344054;
      font-size:12px;
      font-weight:760;
      padding-top:6px;
      white-space:nowrap;
    }

    @media(max-width:820px){
      .screen-nav{width:min(100% - 28px,1120px)}
      .page{width:min(100% - 28px,1120px);padding-top:22px}
      .role-layout{grid-template-columns:1fr;gap:22px}
      .role-chart-card{justify-content:flex-start}
      .role-chart{width:min(100%,360px)}
      .person-row{grid-template-columns:1fr auto;gap:12px}
      .person-info{grid-column:1 / -1}
      .person-roles{grid-column:1}
      .person-total{grid-column:2;grid-row:2}
    }

    @media(max-width:520px){
      .screen-nav,.page{width:min(100% - 24px,1120px)}
      .screen-nav{justify-content:flex-start}
      .screen-switcher{width:100%}
      .screen-tab{flex:1}
      .title{font-size:clamp(34px,11vw,48px)}
      .role-option{min-height:46px;padding:0 12px}
      .person-row{grid-template-columns:1fr}
      .person-info,.person-roles,.person-total{grid-column:1;grid-row:auto}
      .person-total{text-align:left;padding-top:0}
      .role-chip{min-height:34px}
    }

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <nav class="screen-nav" aria-label="Screen switcher">
    <div class="screen-switcher">
      <button class="screen-tab active" type="button" data-screen-target="1" aria-pressed="true">Screen 1</button>
      <button class="screen-tab" type="button" data-screen-target="2" aria-pressed="false">Screen 2</button>
    </div>
  </nav>

  <main class="page role-screen" data-screen="1">
    <header class="hero">
      <h1 class="title">อยากทำหน้าที่อะไร</h1>
      <div class="subtitle">What role do you actually want?</div>
    </header>

    <section aria-label="Role weights">
      <div class="section-head">
        <div class="save-state" data-save-state><span class="save-dot"></span><span>บันทึกอัตโนมัติ</span></div>
      </div>

      <div class="role-layout">
        <div class="role-chart-card">
          <div class="role-chart" data-role-chart aria-label="Role effort pie chart"></div>
        </div>
        <div>
          <div class="role-options" data-role-options></div>
          <div class="role-list-actions">
            <button class="add-role-button" type="button" data-add-role-button>+ Add role</button>
          </div>
          <div class="role-weight-total" data-role-weight-total aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="people-section" aria-labelledby="peopleTitle-1">
      <div class="section-head">
        <div class="section-title" id="peopleTitle-1">คำตอบของแต่ละคน · แก้ไขได้โดยตรง</div>
      </div>
      <div class="people-list" data-people-list></div>
    </section>
  </main>

  <main class="page role-screen hidden" data-screen="2">
    <header class="hero">
      <h1 class="title">อยากทำหน้าที่อะไร</h1>
      <div class="subtitle">What role do you actually want?</div>
    </header>

    <section aria-label="Role weights">
      <div class="section-head">
        <div class="save-state" data-save-state><span class="save-dot"></span><span>บันทึกอัตโนมัติ</span></div>
      </div>

      <div class="role-layout">
        <div class="role-chart-card">
          <div class="role-chart" data-role-chart aria-label="Role effort pie chart"></div>
        </div>
        <div>
          <div class="role-options" data-role-options></div>
          <div class="role-list-actions">
            <button class="add-role-button" type="button" data-add-role-button>+ Add role</button>
          </div>
          <div class="role-weight-total" data-role-weight-total aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="people-section" aria-labelledby="peopleTitle-2">
      <div class="section-head">
        <div class="section-title" id="peopleTitle-2">คำตอบของแต่ละคน · แก้ไขได้โดยตรง</div>
      </div>
      <div class="people-list" data-people-list></div>
    </section>
  </main>

<script>
  const participants = [
    { name:'Tonnam', initials:'TN', accent:'#79e7c4' },
    { name:'Yok', initials:'YK', accent:'#7cb7ff' },
    { name:'Ohm', initials:'OH', accent:'#c59cff' },
    { name:'Phufa', initials:'PF', accent:'#ffd280' },
    { name:'Hope', initials:'HP', accent:'#ff9ec8' }
  ];

  const ROLE_DEFS = [
    { id:'decision', label:'Decision', defaultWeight:20, color:'#E84D5B' },
    { id:'product-manager', label:'Product Manager', defaultWeight:20, color:'#FF7A3F' },
    { id:'app-infra-maintainer', label:'App & Infra Maintainer', defaultWeight:100, color:'#F5B443' },
    { id:'feature-engineer', label:'Feature Engineer', defaultWeight:40, color:'#67CBD0' },
    { id:'uiux-designer', label:'UI/UX Designer', defaultWeight:40, color:'#48ABC6' },
    { id:'marketing-growth', label:'Marketing & Growth', defaultWeight:20, color:'#3A8DBC' },
    { id:'customer-success', label:'Customer Success', defaultWeight:10, color:'#2F67A6' }
  ];

  const CUSTOM_ROLE_COLORS = [
    '#7B61FF','#8B5CF6','#A855F7','#D946EF','#EC4899',
    '#F43F5E','#F97316','#EAB308','#84CC16','#22C55E',
    '#14B8A6','#06B6D4','#0EA5E9','#6366F1'
  ];

  const POSITION_ROLE_COLORS = [
    '#E84D5B', // 1
    '#FF7A3F', // 2
    '#F5B443', // 3
    '#67CBD0', // 4
    '#48ABC6', // 5
    '#3A8DBC', // 6
    '#2F67A6', // 7
    '#E0A800', // 8
    '#84CC16', // 9
    '#22C55E', // 10
    '#7B61FF', // 11
    '#A855F7', // 12
    '#EC4899', // 13
    '#14B8A6'  // 14
  ];

  function positionColorForIndex(index){
    return POSITION_ROLE_COLORS[index % POSITION_ROLE_COLORS.length];
  }

  function applyPositionColors(roles){
    roles.forEach((role, index) => {
      role.color = positionColorForIndex(index);
    });
  }

  function isHexColor(value){
    return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value);
  }

  function cleanRoleLabel(value, fallback='Untitled role'){
    if(typeof value !== 'string') return fallback;
    const cleaned = value.trim().replace(/\s+/g, ' ').slice(0, 80);
    return cleaned || fallback;
  }

  function restoreRoles(defaultRoleList, parsed){
    if(!parsed || !Array.isArray(parsed.roles) || parsed.roles.length === 0){
      return defaultRoleList;
    }

    const defaults = roleMapFor(defaultRoleList);
    const usedIds = new Set();
    const restored = [];

    parsed.roles.forEach((saved, index) => {
      if(!saved || typeof saved !== 'object') return;

      let id = typeof saved.id === 'string' ? saved.id.trim() : '';
      if(!id || usedIds.has(id)) id = `custom-restored-${index}`;
      usedIds.add(id);

      const base = defaults[id];
      restored.push({
        id,
        label: cleanRoleLabel(saved.label, base?.label || `Role ${index + 1}`),
        weight: sanitizeWeight(saved.weight, base?.weight ?? 0),
        color: isHexColor(saved.color) ? saved.color : (base?.color || CUSTOM_ROLE_COLORS[index % CUSTOM_ROLE_COLORS.length])
      });
    });

    return restored.length ? restored : defaultRoleList;
  }

  const LEGACY_PERCENT_STORAGE_KEY = 'lets-talk-role-only-v2';
  const LEGACY_ASSIGNMENT_STORAGE_KEY = 'lets-talk-role-only-v1';
  const SOURCE_STORAGE_KEY = 'lets-talk-responses-v4';
  const SCREEN_KEYS = {
    1:'lets-talk-role-only-v4-screen-1',
    2:'lets-talk-role-only-v4-screen-2'
  };

  const SCREEN_ONE_DEFAULT_WEIGHTS = {
    'decision':5,
    'product-manager':3,
    'app-infra-maintainer':20,
    'feature-engineer':10,
    'uiux-designer':10,
    'marketing-growth':0,
    'customer-success':0
  };

  const SCREEN_ONE_DEFAULT_ASSIGNMENTS = {
    Tonnam:['decision','product-manager','feature-engineer','uiux-designer'],
    Yok:['app-infra-maintainer','feature-engineer'],
    Ohm:['app-infra-maintainer'],
    Phufa:['feature-engineer'],
    Hope:[]
  };

  const SCREEN_TWO_DEFAULT_ROLE_DEFS = [
    { id:'decision', label:'Strategy & Leadership', defaultWeight:5, color:'#E84D5B' },
    { id:'product-manager', label:'Product Manager', defaultWeight:5, color:'#FF7A3F' },
    { id:'app-infra-maintainer-1', label:'App & Infra Maintainer 1', defaultWeight:20, color:'#F5B443' },
    { id:'app-infra-maintainer-2', label:'App & Infra Maintainer 2', defaultWeight:10, color:'#67CBD0' },
    { id:'feature-engineer', label:'Feature Engineer', defaultWeight:10, color:'#48ABC6' },
    { id:'uiux-designer', label:'UI/UX Designer', defaultWeight:10, color:'#3A8DBC' },
    { id:'marketing-growth', label:'Marketing & Growth', defaultWeight:5, color:'#2F67A6' },
    { id:'customer-success', label:'Customer Success', defaultWeight:5, color:'#E0A800' },
    { id:'finance-legal', label:'Finance & Legal', defaultWeight:5, color:'#84CC16' },
    { id:'data-label-half', label:'Data Label (0.5x)', defaultWeight:3, color:'#22C55E' }
  ];

  const SCREEN_TWO_DEFAULT_ASSIGNMENTS = {
    Tonnam:['decision','product-manager','uiux-designer','customer-success'],
    Yok:['app-infra-maintainer-2','finance-legal'],
    Ohm:['app-infra-maintainer-1'],
    Phufa:['data-label-half'],
    Hope:[]
  };

  function roleMapFor(roles){ return Object.fromEntries(roles.map(role => [role.id, role])); }
  function emptyData(){ return Object.fromEntries(participants.map(p => [p.name, []])); }
  function defaultRoles(){ return ROLE_DEFS.map(role => ({...role, weight:role.defaultWeight})); }
  function screenOneDefaultRoles(){
    return ROLE_DEFS.map(role => ({...role, weight:SCREEN_ONE_DEFAULT_WEIGHTS[role.id] ?? role.defaultWeight}));
  }
  function screenOneDefaultAssignments(){
    return Object.fromEntries(participants.map(p => [p.name, [...(SCREEN_ONE_DEFAULT_ASSIGNMENTS[p.name] || [])]]));
  }
  function screenTwoDefaultRoles(){
    return SCREEN_TWO_DEFAULT_ROLE_DEFS.map(role => ({ ...role, weight: role.defaultWeight }));
  }
  function screenTwoDefaultAssignments(){
    return Object.fromEntries(participants.map(p => [p.name, [...(SCREEN_TWO_DEFAULT_ASSIGNMENTS[p.name] || [])]]));
  }
  function copyAssignments(assignments){ return Object.fromEntries(participants.map(p => [p.name, [...(assignments[p.name] || [])]])); }
  function copyWeights(roles){ return Object.fromEntries(roles.map(role => [role.id, role.weight])); }

  function normalizeRoleIds(value, roleMap){
    if(!Array.isArray(value)) return [];
    return [...new Set(value.filter(id => roleMap[id]))];
  }

  function sanitizeWeight(value, fallback){
    const n = Number(value);
    if(!Number.isFinite(n)) return fallback;
    return Math.min(10000, Math.max(0, Math.round(n)));
  }

  function legacyPercentToWeight(value, fallback){
    const n = Number(value);
    if(!Number.isFinite(n)) return fallback;
    if(n <= 0) return 0;
    return Math.max(1, Math.round(n * 2.5));
  }

  function loadScreenOne(){
    let roles = screenOneDefaultRoles();
    const assignments = screenOneDefaultAssignments();

    try{
      const raw = localStorage.getItem(SCREEN_KEYS[1]);
      if(raw){
        const parsed = JSON.parse(raw) || {};
        roles = restoreRoles(roles, parsed);

        const roleMap = roleMapFor(roles);
        const savedAssignments = parsed.assignments || {};
        const savedWeights = parsed.roleWeights || {};

        participants.forEach(p => {
          if(Array.isArray(savedAssignments[p.name])){
            assignments[p.name] = normalizeRoleIds(savedAssignments[p.name], roleMap);
          }
        });

        // Backward compatibility with older saves that stored only weights.
        if(!Array.isArray(parsed.roles)){
          roles.forEach(role => {
            if(Object.prototype.hasOwnProperty.call(savedWeights, role.id)){
              role.weight = sanitizeWeight(savedWeights[role.id], role.weight);
            }
          });
        }
      }
    }catch(e){}

    return { assignments, roles };
  }

  function loadScreenTwo(){
    let roles = screenTwoDefaultRoles();
    const assignments = screenTwoDefaultAssignments();

    try{
      const raw = localStorage.getItem(SCREEN_KEYS[2]);
      if(raw){
        const parsed = JSON.parse(raw) || {};
        roles = restoreRoles(roles, parsed);

        const roleMap = roleMapFor(roles);
        const savedAssignments = parsed.assignments || {};
        const savedWeights = parsed.roleWeights || {};

        participants.forEach(p => {
          if(Array.isArray(savedAssignments[p.name])){
            assignments[p.name] = normalizeRoleIds(savedAssignments[p.name], roleMap);
          }
        });

        // Backward compatibility with older saves that stored only weights.
        if(!Array.isArray(parsed.roles)){
          roles.forEach(role => {
            if(Object.prototype.hasOwnProperty.call(savedWeights, role.id)){
              role.weight = sanitizeWeight(savedWeights[role.id], role.weight);
            }
          });
        }
      }
    }catch(e){}

    return { assignments, roles };
  }

  const screenOneLoaded = loadScreenOne();
  const screenTwoLoaded = loadScreenTwo();

  const screens = {
    1:createScreenController(1, screenOneLoaded),
    2:createScreenController(2, screenTwoLoaded)
  };

  function createScreenController(screenNumber, loaded){
    const root = document.querySelector(`.role-screen[data-screen="${screenNumber}"]`);
    const chartEl = root.querySelector('[data-role-chart]');
    const optionsEl = root.querySelector('[data-role-options]');
    const totalEl = root.querySelector('[data-role-weight-total]');
    const peopleEl = root.querySelector('[data-people-list]');
    const saveEl = root.querySelector('[data-save-state]');
    const addRoleButton = root.querySelector('[data-add-role-button]');
    const roles = loaded.roles;
    const roleMap = roleMapFor(roles);
    const data = loaded.assignments;
    let saveTimer = null;

    function queueSave(){
      saveEl.innerHTML = '<span class="save-dot" style="background:#c6cbd3"></span><span style="color:#98a2b3">กำลังบันทึก…</span>';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem(SCREEN_KEYS[screenNumber], JSON.stringify({
          assignments:data,
          roles:roles.map(role => ({
            id:role.id,
            label:role.label,
            weight:role.weight,
            color:role.color
          })),
          roleWeights:copyWeights(roles)
        }));
        saveEl.innerHTML = '<span class="save-dot"></span><span>บันทึกแล้ว</span>';
      }, 180);
    }

    function formatPercent(value){
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    function roleWeightTotal(){ return roles.reduce((sum, role) => sum + role.weight, 0); }
    function rolePercent(roleId){
      const total = roleWeightTotal();
      return total > 0 ? roleMap[roleId].weight / total * 100 : 0;
    }
    function roleAssignees(roleId){ return participants.filter(p => data[p.name].includes(roleId)); }
    function personRoleShare(roleId){
      const count = roleAssignees(roleId).length;
      const percent = rolePercent(roleId);
      return count ? percent / count : percent;
    }
    function personTotal(name){
      return data[name].reduce((sum, id) => {
        const count = roleAssignees(id).length || 1;
        return sum + rolePercent(id) / count;
      }, 0);
    }

    function pointOnCircle(cx, cy, r, angleDeg){
      const rad = angleDeg * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }
    function wedgePath(cx, cy, r, startAngle, endAngle){
      const start = pointOnCircle(cx, cy, r, startAngle);
      const end = pointOnCircle(cx, cy, r, endAngle);
      const sweep = endAngle - startAngle;
      const largeArc = sweep > 180 ? 1 : 0;
      return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
    }
    function getContrastColor(hex){
      const value = hex.replace('#','');
      const bigint = parseInt(value,16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
      return luminance > 0.72 ? '#172033' : '#ffffff';
    }
    function personSoft(accent){ return accent + '55'; }

    function renderChart(){
      const cx = 180, cy = 180, r = 145;
      const total = roleWeightTotal();
      let startAngle = -90;
      let svg = '';

      if(total <= 0){
        svg = `<circle cx="180" cy="180" r="145" fill="#f7f8fa" stroke="#e6e8ec" />
          <text x="180" y="180" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#98a2b3">0%</text>`;
      } else {
        roles.forEach(role => {
          const percent = rolePercent(role.id);
          const sweep = role.weight / total * 360;
          const endAngle = startAngle + sweep;
          if(role.weight > 0){
            svg += `<path d="${wedgePath(cx,cy,r,startAngle,endAngle)}" fill="${role.color}" stroke="#ffffff" stroke-width="1.5" />`;
            if(percent >= 8){
              const p = pointOnCircle(cx,cy,r*0.70,startAngle+sweep/2);
              svg += `<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="${getContrastColor(role.color)}">${formatPercent(percent)}%</text>`;
            }
          }
          startAngle = endAngle;
        });
      }

      chartEl.innerHTML = `<svg viewBox="0 0 360 360" role="img" aria-label="Effort ratio pie chart">${svg}</svg>`;
    }

    function updateRoleWeightTotal(){
      const total = roleWeightTotal();
      const valid = total > 0;
      totalEl.classList.toggle('invalid', !valid);
      totalEl.innerHTML = valid
        ? `<span class="total-dot"></span><span>รวม Weight ${total} hour · 100%</span>`
        : `<span class="total-dot"></span><span>ต้องมี Weight อย่างน้อย 1</span>`;
    }

    function updateDerivedPercents(){
      optionsEl.querySelectorAll('.role-option').forEach(row => {
        const input = row.querySelector('.role-weight-input');
        const output = row.querySelector('.role-derived-percent');
        if(!input || !output) return;
        output.textContent = `${formatPercent(rolePercent(input.dataset.roleId))}%`;
      });
    }

    function renderRoleOptions(){
      applyPositionColors(roles);

      optionsEl.innerHTML = roles.map(role => `
        <div class="role-option" style="--role-color:${role.color}" data-role-row-id="${escapeHtml(role.id)}">
          <span
            class="role-drag-handle"
            draggable="true"
            tabindex="0"
            data-role-drag-id="${escapeHtml(role.id)}"
            role="button"
            aria-label="Move ${escapeHtml(role.label)}"
            title="Drag to reorder"
          >⋮⋮</span>
          <span class="role-swatch" aria-hidden="true"></span>
          <input
            class="role-name-input"
            type="text"
            maxlength="80"
            value="${escapeHtml(role.label)}"
            data-role-name-id="${escapeHtml(role.id)}"
            aria-label="Role name"
          />
          <span class="weight-editor">
            <input class="role-weight-input" type="number" min="0" max="10000" step="1" inputmode="numeric" value="${role.weight}" data-role-id="${escapeHtml(role.id)}" aria-label="${escapeHtml(role.label)} weight in hours" />
            <span class="role-weight-unit">hour</span>
            <span class="role-derived-percent">${formatPercent(rolePercent(role.id))}%</span>
          </span>
          <button
            class="delete-role-button"
            type="button"
            data-delete-role-id="${escapeHtml(role.id)}"
            aria-label="Delete ${escapeHtml(role.label)}"
            title="Delete role"
          >×</button>
        </div>
      `).join('');

      let draggedRoleId = null;

      function clearDropIndicators(){
        optionsEl.querySelectorAll('.role-option').forEach(row => {
          row.classList.remove('drop-before','drop-after','dragging');
        });
      }

      function moveRole(roleId, targetId, placeAfter){
        const fromIndex = roles.findIndex(role => role.id === roleId);
        const targetIndex = roles.findIndex(role => role.id === targetId);
        if(fromIndex === -1 || targetIndex === -1 || fromIndex === targetIndex) return;

        const [moved] = roles.splice(fromIndex, 1);
        let insertIndex = roles.findIndex(role => role.id === targetId);
        if(placeAfter) insertIndex += 1;
        roles.splice(insertIndex, 0, moved);

        applyPositionColors(roles);
        render();
        queueSave();
      }

      optionsEl.querySelectorAll('.role-drag-handle').forEach(handle => {
        handle.addEventListener('dragstart', event => {
          draggedRoleId = handle.dataset.roleDragId;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', draggedRoleId);

          const row = handle.closest('.role-option');
          if(row) row.classList.add('dragging');
        });

        handle.addEventListener('dragend', () => {
          draggedRoleId = null;
          clearDropIndicators();
        });

        // Keyboard alternative: focus the handle and press ↑ / ↓.
        handle.addEventListener('keydown', event => {
          if(event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
          event.preventDefault();

          const roleId = handle.dataset.roleDragId;
          const index = roles.findIndex(role => role.id === roleId);
          const nextIndex = event.key === 'ArrowUp' ? index - 1 : index + 1;
          if(index < 0 || nextIndex < 0 || nextIndex >= roles.length) return;

          const [moved] = roles.splice(index, 1);
          roles.splice(nextIndex, 0, moved);

          applyPositionColors(roles);
          render();
          queueSave();

          requestAnimationFrame(() => {
            optionsEl.querySelector(`[data-role-drag-id="${roleId}"]`)?.focus();
          });
        });
      });

      optionsEl.querySelectorAll('.role-option').forEach(row => {
        row.addEventListener('dragover', event => {
          if(!draggedRoleId || draggedRoleId === row.dataset.roleRowId) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';

          const rect = row.getBoundingClientRect();
          const placeAfter = event.clientY > rect.top + rect.height / 2;

          optionsEl.querySelectorAll('.role-option').forEach(other => {
            other.classList.remove('drop-before','drop-after');
          });
          row.classList.add(placeAfter ? 'drop-after' : 'drop-before');
        });

        row.addEventListener('drop', event => {
          if(!draggedRoleId || draggedRoleId === row.dataset.roleRowId) return;
          event.preventDefault();

          const rect = row.getBoundingClientRect();
          const placeAfter = event.clientY > rect.top + rect.height / 2;
          const targetId = row.dataset.roleRowId;

          clearDropIndicators();
          moveRole(draggedRoleId, targetId, placeAfter);
          draggedRoleId = null;
        });
      });

      optionsEl.querySelectorAll('.role-name-input').forEach(input => {
        input.addEventListener('input', () => {
          const role = roleMap[input.dataset.roleNameId];
          if(!role) return;
          role.label = input.value.slice(0, 80);
          renderPeople();
          queueSave();
        });

        input.addEventListener('blur', () => {
          const role = roleMap[input.dataset.roleNameId];
          if(!role) return;
          role.label = cleanRoleLabel(input.value);
          input.value = role.label;
          renderPeople();
          queueSave();
        });
      });

      optionsEl.querySelectorAll('.role-weight-input').forEach(input => {
        input.addEventListener('input', () => {
          if(input.value === '') return;
          const role = roleMap[input.dataset.roleId];
          const next = sanitizeWeight(input.value, role.weight);
          role.weight = next;
          updateDerivedPercents();
          renderChart();
          updateRoleWeightTotal();
          renderPeople();
          queueSave();
        });

        input.addEventListener('blur', () => {
          const role = roleMap[input.dataset.roleId];
          const next = sanitizeWeight(input.value, role.weight);
          role.weight = next;
          input.value = String(next);
          updateDerivedPercents();
          renderChart();
          updateRoleWeightTotal();
          renderPeople();
          queueSave();
        });
      });

      optionsEl.querySelectorAll('.delete-role-button').forEach(button => {
        button.addEventListener('click', () => {
          const roleId = button.dataset.deleteRoleId;
          const index = roles.findIndex(role => role.id === roleId);
          if(index === -1) return;

          // Remove the role from every person's assignments first.
          participants.forEach(person => {
            data[person.name] = data[person.name].filter(id => id !== roleId);
          });

          // Remove from the role collections.
          roles.splice(index, 1);
          delete roleMap[roleId];

          render();
          queueSave();
        });
      });

      updateRoleWeightTotal();
    }

    function renderPeople(){
      peopleEl.innerHTML = participants.map(person => {
        const selected = new Set(data[person.name]);
        return `
          <div class="person-row" data-person="${person.name}">
            <div class="person-info">
              <span class="avatar" style="--person-soft:${personSoft(person.accent)}">${person.initials}</span>
              <span class="person-name">${person.name}</span>
            </div>

            <div class="person-roles">
              ${roles.map(role => {
                const isSelected = selected.has(role.id);
                const share = isSelected ? personRoleShare(role.id) : rolePercent(role.id);
                return `
                  <label class="role-chip ${isSelected ? 'selected' : ''}" style="--role-color:${role.color}" title="${role.label}">
                    <input type="checkbox" value="${role.id}" ${isSelected ? 'checked' : ''} />
                    <span class="chip-dot"></span>
                    <span>${role.label}</span>
                    <span class="chip-share">${formatPercent(share)}%</span>
                  </label>
                `;
              }).join('')}
            </div>

            <div class="person-total">รวม ${formatPercent(personTotal(person.name))}%</div>
          </div>
        `;
      }).join('');

      peopleEl.querySelectorAll('.person-row').forEach(row => {
        const name = row.dataset.person;
        row.querySelectorAll('input[type="checkbox"]').forEach(input => {
          input.addEventListener('change', () => {
            const checked = [...row.querySelectorAll('input[type="checkbox"]:checked')].map(el => el.value);
            data[name] = checked;
            renderPeople();
            queueSave();
          });
        });
      });
    }

    function addRole(){
      const stamp = Date.now().toString(36);
      let id = `custom-${stamp}`;
      let suffix = 1;
      while(roleMap[id]){
        id = `custom-${stamp}-${suffix++}`;
      }

      const role = {
        id,
        label:'New role',
        weight:0,
        color:positionColorForIndex(roles.length)
      };

      roles.push(role);
      roleMap[role.id] = role;
      render();
      queueSave();

      requestAnimationFrame(() => {
        const input = optionsEl.querySelector(`[data-role-name-id="${role.id}"]`);
        if(input){
          input.focus();
          input.select();
        }
      });
    }

    addRoleButton?.addEventListener('click', addRole);

    function render(){
      applyPositionColors(roles);
      renderChart();
      renderRoleOptions();
      renderPeople();
    }

    render();
    return { root, render, data, roles };
  }

  function showScreen(screenNumber){
    document.querySelectorAll('.role-screen').forEach(screen => {
      screen.classList.toggle('hidden', Number(screen.dataset.screen) !== screenNumber);
    });
    document.querySelectorAll('.screen-tab').forEach(tab => {
      const active = Number(tab.dataset.screenTarget) === screenNumber;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    window.scrollTo({top:0, behavior:'instant'});
  }

  document.querySelectorAll('.screen-tab').forEach(tab => {
    tab.addEventListener('click', () => showScreen(Number(tab.dataset.screenTarget)));
  });
</script>
</body>
